name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
      release:
        description: if this is a release build
        type: boolean
        default: false
      upload_artifacts:
        description: if built archives should be uploaded as workflow artifacts
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.id }} (${{ matrix.target }}) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-arm64
            target: "aarch64-unknown-linux-gnu"
            os: "ubuntu-24.04-arm"
            platform: "linux/arm64/v8"
            architecture: "AArch64"
            cflags: "-O2 -march=armv8-a"

          - id: linux-arm64-musl
            target: "aarch64-unknown-linux-musl"
            os: "ubuntu-24.04-arm"
            platform: "linux/arm64/v8"
            architecture: "AArch64"
            cflags: "-O2 -march=armv8-a"

          - id: linux-arm
            target: "arm-unknown-linux-gnueabi"
            os: "ubuntu-latest"
            platform: "linux/arm/v5"
            architecture: "ARM"
            cflags: "-O2 -march=armv6 -mfloat-abi=soft"
            qemu_cpu: "arm1176"

          - id: linux-armhf-musl
            target: "arm-unknown-linux-musleabihf"
            os: "ubuntu-latest"
            platform: "linux/arm/v6"
            architecture: "ARM"
            cflags: "-O2 -march=armv6 -mfloat-abi=hard -mfpu=vfp"
            qemu_cpu: "arm1176"

          - id: linux-armv5te
            target: "armv5te-unknown-linux-gnueabi"
            os: "ubuntu-latest"
            platform: "linux/arm/v5"
            architecture: "ARM"
            cflags: "-O2 -march=armv5te -mfloat-abi=soft"
            qemu_cpu: "arm926"

          - id: linux-armv7l
            target: "armv7-unknown-linux-gnueabihf"
            os: "ubuntu-latest"
            platform: "linux/arm/v7"
            architecture: "ARM"
            cflags: "-O2 -march=armv7-a -mfloat-abi=hard -mfpu=vfp"
            qemu_cpu: "cortex-a7"

          - id: linux-armv7l-musl
            target: "armv7-unknown-linux-musleabihf"
            os: "ubuntu-latest"
            platform: "linux/arm/v7"
            architecture: "ARM"
            cflags: "-O2 -march=armv7-a -mfloat-abi=hard -mfpu=vfp"
            qemu_cpu: "cortex-a7"

          - id: linux-x64
            target: "x86_64-unknown-linux-gnu"
            os: "ubuntu-latest"
            platform: "linux/amd64"
            architecture: "Advanced Micro Devices X86-64"
            cflags: "-O2 -march=x86-64"

          - id: linux-x64-musl
            target: "x86_64-unknown-linux-musl"
            os: "ubuntu-latest"
            platform: "linux/amd64"
            architecture: "Advanced Micro Devices X86-64"
            cflags: "-O2 -march=x86-64"

          - id: linux-x86
            target: "i686-unknown-linux-gnu"
            os: "ubuntu-latest"
            platform: "linux/386"
            architecture: "Intel 80386"
            cflags: "-O2 -march=i686 -msse2 -mfpmath=sse"

          - id: linux-x86-musl
            target: "i686-unknown-linux-musl"
            os: "ubuntu-latest"
            platform: "linux/386"
            architecture: "Intel 80386"
            cflags: "-O2 -march=i686 -msse2 -mfpmath=sse"

          - id: linux-mips64le
            target: "mips64el-unknown-linux-gnuabi64"
            os: "ubuntu-latest"
            platform: "linux/mips64le"
            architecture: "MIPS R3000"
            cflags: "-O2 -march=mips64r2"

          - id: linux-powerpc64el
            target: "powerpc64le-unknown-linux-gnu"
            os: "ubuntu-latest"
            platform: "linux/ppc64le"
            architecture: "PowerPC64"
            cflags: "-O2 -mcpu=power8"

          - id: linux-powerpc64el-musl
            target: "powerpc64le-unknown-linux-musl"
            os: "ubuntu-latest"
            platform: "linux/ppc64le"
            architecture: "PowerPC64"
            cflags: "-O2 -mcpu=power8"

          - id: linux-s390x
            target: "s390x-unknown-linux-gnu"
            os: "ubuntu-latest"
            platform: "linux/s390x"
            architecture: "IBM S/390"
            cflags: "-O2 -march=z196"

          - id: linux-s390x-musl
            target: "s390x-unknown-linux-musl"
            os: "ubuntu-latest"
            platform: "linux/s390x"
            architecture: "IBM S/390"
            cflags: "-O2 -march=z196"

          - id: macos-arm64
            target: "aarch64-apple-darwin"
            os: "macos-15"
            architecture: "arm64"

          - id: macos-x64
            target: "x86_64-apple-darwin"
            os: "macos-15-intel"
            architecture: "x86_64"

          - id: windows-x64
            target: "x86_64-pc-windows-msvc"
            os: "windows-latest"
            architecture: "x86-64"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup environment
        run: |
          version=$(echo "${{ github.ref_name }}" | grep '^[0-9]*.[0-9]*.[0-9]*$') || true

          if [ -z "$version" ]; then
            # Set default version for non-release builds
            version="18.6.0"
          fi

          root_directory="$(pwd)"
          archive="postgresql-$version-${{ matrix.target }}"
          install_directory="$root_directory/$archive"

          echo "ARCHIVE=$archive" | tee -a $GITHUB_ENV
          echo "INSTALL_DIRECTORY=$install_directory" | tee -a $GITHUB_ENV
          echo "ROOT_DIRECTORY=$root_directory" | tee -a $GITHUB_ENV
          echo "VERSION=$version" | tee -a "$GITHUB_ENV"
          echo "BUILD_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      #
      # Linux Build
      #

      - name: Install emulators and configure build (Linux)
        if: ${{ startsWith(matrix.id, 'linux-') }}
        run: |
          platform="${{ matrix.platform }}";
          
          # tonistiigi/binfmt:latest, resolved 2026-09-27
          docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all
          
          if [[ "${{ matrix.id }}" = *musl* ]]; then
            echo "DOCKERFILE=dockerfiles/Dockerfile.linux-musl" | tee -a $GITHUB_ENV
          else
            echo "DOCKERFILE=dockerfiles/Dockerfile.linux-gnu" | tee -a $GITHUB_ENV
          fi
          
          echo "PLATFORM=$platform" | tee -a $GITHUB_ENV

      - name: Build (Linux)
        env:
          TARGET_CFLAGS: ${{ matrix.cflags }}
          TARGET: ${{ matrix.target }}
        if: ${{ startsWith(matrix.id, 'linux-') }}
        run: |
          cp $DOCKERFILE Dockerfile
          docker buildx build --build-arg "POSTGRESQL_VERSION=$VERSION" --build-arg "TARGET_CFLAGS=$TARGET_CFLAGS" --build-arg "TARGET=$TARGET" --build-arg "BUILD_REVISION=$BUILD_REVISION" --platform "$PLATFORM" --tag postgresql-build:latest .
          
          docker create --platform "$PLATFORM" --name pgbuild postgresql-build:latest
          docker cp pgbuild:/opt/postgresql $INSTALL_DIRECTORY
          docker rm -f pgbuild

      #
      # MacOS Build
      #

      - name: Checkout postgresql source code (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: |
          source_directory="$ROOT_DIRECTORY/postgresql-src"
          ./scripts/fetch-source.sh "$VERSION" "$source_directory"
          echo "SOURCE_DIRECTORY=$source_directory" | tee -a $GITHUB_ENV

      - name: Configure build (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: |
          ./scripts/configure-macos.sh

      - name: Build (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: ./scripts/build-macos.sh

      # This allows the MacOS build to be relocated to a different directory and bundles dependencies
      - name: Update library paths (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: |
          brew_dir="/usr/local"
          if [ "${{ matrix.id }}" == "macos-arm64" ]; then
            brew_dir="/opt/homebrew"
          fi
          ./scripts/macos-bundle-deps.sh "$INSTALL_DIRECTORY" "$brew_dir"

      #
      # Windows
      #

      - name: Download binaries (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') }}
        run: |
          ./scripts/fetch-windows.sh "$VERSION" postgresql.zip

      - name: Extract binaries (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') }}
        run: |
          unzip postgresql.zip
          rm -rf pgsql/pgAdmin*
          mv pgsql "$INSTALL_DIRECTORY"
          cp windows-input.json "$INSTALL_DIRECTORY/source-input.json"

      - name: Detect EDB Python ABI
        if: ${{ startsWith(matrix.id, 'windows-') }}
        id: windows_python
        run: python3 scripts/windows-runtime.py detect "$INSTALL_DIRECTORY" >> "$GITHUB_OUTPUT"

      - name: Install matching Windows Python
        if: ${{ startsWith(matrix.id, 'windows-') }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ steps.windows_python.outputs.version }}
          architecture: x64

      - name: Bundle and audit Windows runtime
        if: ${{ startsWith(matrix.id, 'windows-') }}
        run: python scripts/windows-runtime.py bundle "$INSTALL_DIRECTORY"

      #
      # Package
      #

      - name: Record build metadata (macOS, Windows)
        if: ${{ !startsWith(matrix.id, 'linux-') }}
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/build-metadata.py "$INSTALL_DIRECTORY" "$VERSION" "$TARGET"

      - name: Check redistribution notices
        if: ${{ inputs.release == true && !startsWith(matrix.id, 'windows-') }}
        run: |
          python3 - "$INSTALL_DIRECTORY/runtime-dependencies.json" <<'PYTHON'
          import json, sys
          data = json.load(open(sys.argv[1]))
          if data.get("missing_notices"):
              raise SystemExit("Release blocked: dependency notices are incomplete")
          PYTHON

      - name: Validate binary target compatibility
        env:
          TARGET: ${{ matrix.target }}
        run: python3 scripts/verify-target.py "$INSTALL_DIRECTORY" "$TARGET"

      - name: Prepare archive
        run: |
          cp $ROOT_DIRECTORY/{README.md,LICENSE} "$INSTALL_DIRECTORY"
          ls -l "$INSTALL_DIRECTORY/"

      # The .tar.gz archive is the primary archive for all platforms.  This archive
      # provides a consistent experience for programmatic cases (e.g. embedded).
      - name: Build archive (Linux, MacOS)
        if: ${{ !startsWith(matrix.id, 'windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          python3 scripts/checksum.py "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      - name: Build archive (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          python3 scripts/checksum.py "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      # The zip archive for Windows is created as a convenience to users for manual installations.
      - name: Build .zip archive (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') }}
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          python3 scripts/checksum.py "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"
          echo "WINDOWS_ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          echo "WINDOWS_ASSET_SUM=$ARCHIVE.zip.sha256" >> "$GITHUB_ENV"
          echo "WINDOWS_MANIFEST=$ARCHIVE.zip.manifest.json" >> "$GITHUB_ENV"
          echo "WINDOWS_SBOM=$ARCHIVE.zip.spdx.json" >> "$GITHUB_ENV"

      #
      # Test
      #

      - name: Test build / archive
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          if [[ "$TARGET" == *musl* ]]; then
            export RUNTIME_IMAGE=alpine:3.19.0@sha256:51b67269f354137895d43f3b3d810bfacd3945438e94dc5ac55fdac340352f48
          elif [[ "$TARGET" == *linux* ]]; then
            export RUNTIME_IMAGE=debian:12.4@sha256:79becb70a6247d277b59c09ca340bbe0349af6aacb5afa90ec349528b53ce2c9
          fi
          ./scripts/test-archive.sh "$ASSET" "$VERSION"
          cp "$ASSET_SUM" "$ASSET.tested.sha256"
          if [ -n "${WINDOWS_ASSET:-}" ]; then
            ./scripts/test-archive.sh "$WINDOWS_ASSET" "$VERSION"
            cp "$WINDOWS_ASSET_SUM" "$WINDOWS_ASSET.tested.sha256"
          fi

      - name: Test with a different system ICU
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' }}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
          RUNTIME_IMAGE: postgresql-test-icu:local
        run: |
          docker build --platform "$PLATFORM" -f dockerfiles/Dockerfile.test-icu -t "$RUNTIME_IMAGE" .
          ./scripts/test-archive.sh "$ASSET" "$VERSION"

      - name: Generate and validate manifests and SBOMs
        run: |
          for asset in "$ASSET" ${WINDOWS_ASSET:+"$WINDOWS_ASSET"}; do
            python3 scripts/verify-checksum.py "$asset" "$asset.tested.sha256"
            python3 scripts/archive-manifest.py generate "$asset"
            python3 scripts/archive-manifest.py verify "$asset"
          done

      - name: Attest release provenance
        if: ${{ inputs.release == true }}
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: |
            ${{ env.ASSET }}
            ${{ env.ASSET }}.manifest.json
            ${{ env.ASSET }}.spdx.json
            ${{ env.WINDOWS_ASSET }}
            ${{ env.WINDOWS_MANIFEST }}
            ${{ env.WINDOWS_SBOM }}

      - name: Attest release SBOM
        if: ${{ inputs.release == true }}
        id: sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: ${{ env.ASSET }}
          sbom-path: ${{ env.ASSET }}.spdx.json

      - name: Attest Windows zip SBOM
        if: ${{ inputs.release == true && startsWith(matrix.id, 'windows-') }}
        id: windows_sbom
        uses: actions/attest-sbom@4651f806c01d8637787e274ac3bdf724ef169f34 # v3
        with:
          subject-path: ${{ env.WINDOWS_ASSET }}
          sbom-path: ${{ env.WINDOWS_SBOM }}

      - name: Preserve attestation bundles
        if: ${{ inputs.release == true }}
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          SBOM_BUNDLE: ${{ steps.sbom.outputs.bundle-path }}
        run: |
          cp "$PROVENANCE_BUNDLE" "$ASSET.provenance.json"
          cp "$SBOM_BUNDLE" "$ASSET.sbom-attestation.json"

      - name: Stage archive artifacts
        if: ${{ inputs.upload_artifacts == true }}
        run: |
          mkdir -p artifacts
          cp "$ASSET" "$ASSET_SUM" "$ASSET.manifest.json" "$ASSET.spdx.json" artifacts/

          if [ -n "${WINDOWS_ASSET:-}" ]; then
            cp "$WINDOWS_ASSET" "$WINDOWS_ASSET_SUM" "$WINDOWS_ASSET.manifest.json" "$WINDOWS_ASSET.spdx.json" artifacts/
          fi

      - name: Upload archive artifacts
        if: ${{ inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: postgresql-${{ matrix.id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      #
      # Release
      #

      - name: Upload release archive
        if: ${{ inputs.release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify-checksum.py "$ASSET" "$ASSET.tested.sha256"
          gh release upload "$VERSION" "$ASSET" "$ASSET_SUM" "$ASSET.manifest.json" "$ASSET.spdx.json" "$ASSET.provenance.json" "$ASSET.sbom-attestation.json"
          mkdir draft-check
          gh release download "$VERSION" --pattern "$ASSET" --dir draft-check
          python3 scripts/verify-checksum.py "draft-check/$ASSET" "$ASSET.tested.sha256"

      - name: Upload release archive (Windows)
        if: ${{ inputs.release == true && startsWith(matrix.id, 'windows-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify-checksum.py "$WINDOWS_ASSET" "$WINDOWS_ASSET.tested.sha256"
          gh release upload "$VERSION" "$WINDOWS_ASSET" "$WINDOWS_ASSET_SUM" "$WINDOWS_ASSET.manifest.json" "$WINDOWS_ASSET.spdx.json"
          gh release download "$VERSION" --pattern "$WINDOWS_ASSET" --dir draft-check
          python3 scripts/verify-checksum.py "draft-check/$WINDOWS_ASSET" "$WINDOWS_ASSET.tested.sha256"
