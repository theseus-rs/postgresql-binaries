name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
      release:
        description: if this is a release build
        type: boolean
        default: false
      upload_artifacts:
        description: if built archives should be uploaded as workflow artifacts
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.id }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: aarch64-unknown-linux-gnu
            target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/arm64/v8
            architecture: AArch64
            cflags: -O2 -march=armv8-a
            qemu_cpu: cortex-a53

          - id: aarch64-unknown-linux-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/arm64/v8
            architecture: AArch64
            cflags: -O2 -march=armv8-a
            qemu_cpu: cortex-a53

          - id: arm-unknown-linux-gnueabi
            target: arm-unknown-linux-gnueabi
            os: ubuntu-latest
            platform: linux/arm/v5
            architecture: ARM
            cflags: -O2 -march=armv6 -mfloat-abi=soft
            qemu_cpu: arm1176

          - id: arm-unknown-linux-musleabihf
            target: arm-unknown-linux-musleabihf
            os: ubuntu-latest
            platform: linux/arm/v6
            architecture: ARM
            cflags: -O2 -march=armv6 -mfloat-abi=hard -mfpu=vfp
            qemu_cpu: arm1176

          - id: armv5te-unknown-linux-gnueabi
            target: armv5te-unknown-linux-gnueabi
            os: ubuntu-latest
            platform: linux/arm/v5
            architecture: ARM
            cflags: -O2 -march=armv5te -mfloat-abi=soft
            qemu_cpu: arm926

          - id: armv7-unknown-linux-gnueabihf
            target: armv7-unknown-linux-gnueabihf
            os: ubuntu-latest
            platform: linux/arm/v7
            architecture: ARM
            cflags: -O2 -march=armv7-a -mfloat-abi=hard -mfpu=vfp
            qemu_cpu: cortex-a7

          - id: armv7-unknown-linux-musleabihf
            target: armv7-unknown-linux-musleabihf
            os: ubuntu-latest
            platform: linux/arm/v7
            architecture: ARM
            cflags: -O2 -march=armv7-a -mfloat-abi=hard -mfpu=vfp
            qemu_cpu: cortex-a7

          - id: x86_64-unknown-linux-gnu
            target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux/amd64
            architecture: Advanced Micro Devices X86-64
            cflags: -O2 -march=x86-64
            qemu_cpu: qemu64,-sse3,-cx16,-lahf-lm

          - id: x86_64-unknown-linux-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/amd64
            architecture: Advanced Micro Devices X86-64
            cflags: -O2 -march=x86-64
            qemu_cpu: qemu64,-sse3,-cx16,-lahf-lm

          - id: i686-unknown-linux-gnu
            target: i686-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux/386
            architecture: Intel 80386
            cflags: -O2 -march=i686 -msse2 -mfpmath=sse
            qemu_cpu: qemu32,-sse3

          - id: i686-unknown-linux-musl
            target: i686-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/386
            architecture: Intel 80386
            cflags: -O2 -march=i686 -msse2 -mfpmath=sse
            qemu_cpu: qemu32,-sse3

          - id: arm-unknown-linux-musleabi
            target: arm-unknown-linux-musleabi
            os: ubuntu-latest
            platform: linux/arm/v6
            architecture: ARM
            cflags: -O2 -march=armv6 -mfloat-abi=soft
            qemu_cpu: arm1176,vfp=off
            baseline_build: true

          - id: arm-unknown-linux-gnueabihf
            target: arm-unknown-linux-gnueabihf
            os: ubuntu-latest
            platform: linux/arm/v6
            architecture: ARM
            cflags: -O2 -march=armv6 -mfloat-abi=hard -mfpu=vfp
            qemu_cpu: arm1176
            baseline_build: true

          - id: i586-unknown-linux-gnu
            target: i586-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux/386
            architecture: Intel 80386
            cflags: -O2 -march=i586 -mno-sse -mno-sse2 -mfpmath=387
            qemu_cpu: pentium
            baseline_build: true

          - id: i586-unknown-linux-musl
            target: i586-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/386
            architecture: Intel 80386
            cflags: -O2 -march=i586 -mno-sse -mno-sse2 -mfpmath=387
            qemu_cpu: pentium
            baseline_build: true

          - id: mips64el-unknown-linux-gnuabi64
            target: mips64el-unknown-linux-gnuabi64
            os: ubuntu-latest
            platform: linux/mips64le
            architecture: MIPS R3000
            cflags: -O2 -march=mips64r2
            qemu_cpu: MIPS64R2-generic

          - id: powerpc64le-unknown-linux-gnu
            target: powerpc64le-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/ppc64le
            architecture: PowerPC64
            cflags: -O2 -mcpu=power8
            qemu_cpu: power8

          - id: powerpc64le-unknown-linux-musl
            target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/ppc64le
            architecture: PowerPC64
            cflags: -O2 -mcpu=power8
            qemu_cpu: power8

          - id: s390x-unknown-linux-gnu
            target: s390x-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/s390x
            architecture: IBM S/390
            cflags: -O2 -march=z196
            qemu_cpu: z196-base,msa=off,dateh2=off,cmpsceh=off,pfpo=off,dfphp=off,dfp=off,emon=off,parseh=off,hfpue=off,hfpm=off,nonqks=off,csske=off,asnlxr=off,tods=off

          - id: s390x-unknown-linux-musl
            target: s390x-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/s390x
            architecture: IBM S/390
            cflags: -O2 -march=z196
            qemu_cpu: z196-base,msa=off,dateh2=off,cmpsceh=off,pfpo=off,dfphp=off,dfp=off,emon=off,parseh=off,hfpue=off,hfpm=off,nonqks=off,csske=off,asnlxr=off,tods=off

          - id: aarch64-apple-darwin
            target: aarch64-apple-darwin
            os: macos-15
            architecture: arm64

          - id: x86_64-apple-darwin
            target: x86_64-apple-darwin
            os: macos-15-intel
            architecture: x86_64

          - id: x86_64-pc-windows-msvc
            target: x86_64-pc-windows-msvc
            os: windows-latest
            architecture: x86-64
            msvc_arch: x64
            pe_machine: "0x8664"
            python_architecture: x64
            vcpkg_triplet: x64-windows

          - id: aarch64-pc-windows-msvc
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
            architecture: AArch64
            msvc_arch: arm64
            pe_machine: "0xaa64"
            python_architecture: arm64
            vcpkg_triplet: arm64-windows

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup environment
        run: |
          version=$(echo "${{ github.ref_name }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$') || true

          if [ -z "$version" ]; then
            # Set default version for non-release builds
            version="18.6.0"
          fi

          root_directory="$(pwd)"
          postgresql_version=$(echo "$version" | awk -F. '{print ""$1"."$2}')
          postgresql_major_version=$(echo "$version" | awk -F. '{print ""$1}')
          archive="postgresql-$version-${{ matrix.target }}"
          install_directory="$root_directory/$archive"

          echo "ARCHIVE=$archive" | tee -a $GITHUB_ENV
          echo "BUILD_SUPPORTED=true" | tee -a $GITHUB_ENV
          echo "INSTALL_DIRECTORY=$install_directory" | tee -a $GITHUB_ENV
          echo "PLATFORM=${{ matrix.platform }}" | tee -a $GITHUB_ENV
          echo "POSTGRESQL_MAJOR_VERSION=$postgresql_major_version" | tee -a $GITHUB_ENV
          echo "POSTGRESQL_VERSION=$postgresql_version" | tee -a $GITHUB_ENV
          echo "ROOT_DIRECTORY=$root_directory" | tee -a $GITHUB_ENV
          echo "VERSION=$version" | tee -a $GITHUB_ENV

      - name: Check build support
        id: build_support
        run: |
          supported=true

          if [[ "${{ matrix.target }}" == "aarch64-pc-windows-msvc" && "$POSTGRESQL_MAJOR_VERSION" -lt 16 ]]; then
            echo "::notice::Windows ARM64 source builds require PostgreSQL 16 or newer; skipping PostgreSQL $POSTGRESQL_VERSION."
            supported=false
          fi

          echo "supported=$supported" | tee -a "$GITHUB_OUTPUT"
          echo "BUILD_SUPPORTED=$supported" | tee -a "$GITHUB_ENV"

      #
      # Linux Build
      #

      - name: Set up baseline CPU emulation
        if: ${{ matrix.baseline_build == true }}
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all # 2026-09-27

      - name: Check baseline CPU enforcement
        if: ${{ matrix.baseline_build == true }}
        timeout-minutes: 2
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: ./scripts/test-baseline-cpu.sh

      - name: Install source build prerequisites
        if: ${{ matrix.baseline_build == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bzip2 cpio file git jq patchelf patch perl python3 rsync unzip wget

      - name: Build (Linux)
        env:
          TARGET_CFLAGS: ${{ matrix.cflags }}
        if: ${{ contains(matrix.target, '-linux-') }}
        run: ./scripts/build-linux.sh "$VERSION" "${{ matrix.target }}" "${{ matrix.platform }}"

      #
      # MacOS Build
      #

      - name: Test macOS build helpers
        if: ${{ contains(matrix.target, '-apple-') }}
        run: |
          bash tests/test-macos-options.sh
          bash tests/test-macos-symlinks.sh

      - name: Build (MacOS)
        if: ${{ contains(matrix.target, '-apple-') }}
        run: ./scripts/build-macos.sh "$VERSION" "${{ matrix.target }}"

      #
      # Windows
      #

      - name: Setup Python (Windows)
        if: ${{ contains(matrix.target, '-windows-') && steps.build_support.outputs.supported == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          architecture: ${{ matrix.python_architecture }}

      - name: Configure MSVC (Windows)
        if: ${{ contains(matrix.target, '-windows-') && steps.build_support.outputs.supported == 'true' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build (Windows)
        if: ${{ contains(matrix.target, '-windows-') && steps.build_support.outputs.supported == 'true' }}
        run: ./scripts/build-windows.sh "$VERSION" "${{ matrix.target }}" "${{ matrix.vcpkg_triplet }}"

      #
      # Package
      #

      - name: Check redistribution notices
        if: ${{ inputs.release == true && !contains(matrix.target, '-windows-') }}
        run: |
          jq -e '(.missing_notices // []) | length == 0' "$INSTALL_DIRECTORY/runtime-dependencies.json"

      - name: Validate binary target compatibility
        if: ${{ steps.build_support.outputs.supported == 'true' }}
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *windows* ]]; then python_command=python; else python_command=python3; fi
          "$python_command" scripts/verify-target.py "$INSTALL_DIRECTORY" "$TARGET"

      - name: Prepare archive
        if: ${{ steps.build_support.outputs.supported == 'true' }}
        run: |
          cp $ROOT_DIRECTORY/{README.md,LICENSE} "$INSTALL_DIRECTORY"
          ls -l "$INSTALL_DIRECTORY/"

      # The .tar.gz archive is the primary archive for all platforms.  This archive
      # provides a consistent experience for programmatic cases (e.g. embedded).
      - name: Build archive (Linux, MacOS)
        if: ${{ steps.build_support.outputs.supported == 'true' && !contains(matrix.target, '-windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          ./scripts/checksum.sh "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      - name: Build archive (Windows)
        if: ${{ steps.build_support.outputs.supported == 'true' && contains(matrix.target, '-windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          ./scripts/checksum.sh "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      # The zip archive for Windows is created as a convenience to users for manual installations.
      - name: Build .zip archive (Windows)
        if: ${{ steps.build_support.outputs.supported == 'true' && contains(matrix.target, '-windows-') }}
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          ./scripts/checksum.sh "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"
          echo "WINDOWS_ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          echo "WINDOWS_ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV

      #
      # Test
      #

      - name: Test build / archive
        if: ${{ steps.build_support.outputs.supported == 'true' }}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          if [ -n "${RUNTIME_IMAGE:-}" ]; then
            : # Source-built targets provide their matching minimal runtime.
          elif [[ "$TARGET" == *musl* ]]; then
            export RUNTIME_IMAGE=alpine:3.19.0@sha256:51b67269f354137895d43f3b3d810bfacd3945438e94dc5ac55fdac340352f48
          elif [[ "$TARGET" == *linux* ]]; then
            export RUNTIME_IMAGE=debian:12.4@sha256:79becb70a6247d277b59c09ca340bbe0349af6aacb5afa90ec349528b53ce2c9
          fi
          ./scripts/test-archive.sh "$ASSET" "$VERSION"
          cp "$ASSET_SUM" "$ASSET.tested.sha256"
          if [ -n "${WINDOWS_ASSET:-}" ]; then
            ./scripts/test-archive.sh "$WINDOWS_ASSET" "$VERSION"
            cp "$WINDOWS_ASSET_SUM" "$WINDOWS_ASSET.tested.sha256"
          fi

      - name: Test with a different system ICU
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' }}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
          RUNTIME_IMAGE: postgresql-test-icu:local
        run: |
          docker build --platform "$PLATFORM" -f dockerfiles/Dockerfile.test-icu -t "$RUNTIME_IMAGE" .
          ./scripts/test-archive.sh "$ASSET" "$VERSION"

      - name: Stage archive artifacts
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.upload_artifacts == true }}
        run: |
          mkdir -p artifacts
          cp "$ASSET" "$ASSET_SUM" artifacts/

          if [ -n "${WINDOWS_ASSET:-}" ]; then
            cp "$WINDOWS_ASSET" "$WINDOWS_ASSET_SUM" artifacts/
          fi

      - name: Upload archive artifacts
        id: archive_artifacts
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v7
        with:
          name: postgresql-${{ matrix.id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Link archive artifacts
        if: ${{ steps.archive_artifacts.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.archive_artifacts.outputs.artifact-url }}
        run: |
          echo "### PostgreSQL archives (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download archives and SHA-256 checksums]($ARTIFACT_URL) (retained for 14 days)." >> "$GITHUB_STEP_SUMMARY"

      #
      # Release
      #

      - name: Upload release archive
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-checksum.sh "$ASSET" "$ASSET.tested.sha256"
          gh release upload "$VERSION" "$ASSET" "$ASSET_SUM"
          mkdir draft-check
          gh release download "$VERSION" --pattern "$ASSET" --dir draft-check
          ./scripts/verify-checksum.sh "draft-check/$ASSET" "$ASSET.tested.sha256"

      - name: Upload release archive (Windows)
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.release == true && contains(matrix.target, '-windows-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-checksum.sh "$WINDOWS_ASSET" "$WINDOWS_ASSET.tested.sha256"
          gh release upload "$VERSION" "$WINDOWS_ASSET" "$WINDOWS_ASSET_SUM"
          gh release download "$VERSION" --pattern "$WINDOWS_ASSET" --dir draft-check
          ./scripts/verify-checksum.sh "draft-check/$WINDOWS_ASSET" "$WINDOWS_ASSET.tested.sha256"
