name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
      release:
        description: if this is a release build
        type: boolean
        default: false
      upload_artifacts:
        description: if built archives should be uploaded as workflow artifacts
        type: boolean
        default: false

jobs:
  build:
    name: ${{ matrix.id }} (${{ matrix.target }}) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        id:
          - linux-arm64
          - linux-arm64-musl
          - linux-arm
          - linux-arm-musl
          - linux-armhf
          - linux-armhf-musl
          - linux-armv5te
          - linux-armv7l
          - linux-armv7l-musl
          - linux-x64
          - linux-x64-musl
          - linux-x86
          - linux-x86-musl
          - linux-i586
          - linux-i586-musl
          - linux-mips64le
          - linux-powerpc64el
          - linux-powerpc64el-musl
          - linux-s390x
          - linux-s390x-musl
          - macos-arm64
          - macos-x64
          - windows-x64
          - windows-arm64

        include:
          # When adding a new target, define a new id above

          #
          # Linux
          #

          - id: linux-arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            platform: linux/arm64/v8
            architecture: "AArch64"

          - id: linux-arm64-musl
            target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            platform: linux/arm64/v8
            architecture: "AArch64"

          - id: linux-arm
            target: arm-unknown-linux-gnueabi
            os: ubuntu-24.04-arm
            platform: linux/arm/v6
            architecture: "ARM"

          - id: linux-arm-musl
            target: arm-unknown-linux-musleabi
            os: ubuntu-24.04-arm
            platform: linux/arm/v6
            architecture: "ARM"

          - id: linux-armhf
            target: arm-unknown-linux-gnueabihf
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            architecture: "ARM"

          - id: linux-armhf-musl
            target: arm-unknown-linux-musleabihf
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            architecture: "ARM"

          - id: linux-armv5te
            target: armv5te-unknown-linux-gnueabi
            os: ubuntu-24.04-arm
            platform: linux/arm/v5
            architecture: "ARM"

          - id: linux-armv7l
            target: armv7-unknown-linux-gnueabihf
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            architecture: "ARM"

          - id: linux-armv7l-musl
            target: armv7-unknown-linux-musleabihf
            os: ubuntu-24.04-arm
            platform: linux/arm/v7
            architecture: "ARM"

          - id: linux-x64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/amd64
            architecture: "Advanced Micro Devices X86-64"

          - id: linux-x64-musl
            target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/amd64
            architecture: "Advanced Micro Devices X86-64"

          - id: linux-x86
            target: i686-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/386
            architecture: "Intel 80386"

          - id: linux-x86-musl
            target: i686-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/386
            architecture: "Intel 80386"

          - id: linux-i586
            target: i586-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/386
            architecture: "Intel 80386"

          - id: linux-i586-musl
            target: i586-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/386
            architecture: "Intel 80386"

          - id: linux-mips64le
            target: mips64-unknown-linux-gnuabi64
            os: ubuntu-latest
            platform: linux/mips64le
            architecture: "MIPS R3000"

          - id: linux-powerpc64el
            target: powerpc64le-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/ppc64le
            architecture: "PowerPC64"

          - id: linux-powerpc64el-musl
            target: powerpc64le-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/ppc64le
            architecture: "PowerPC64"

          - id: linux-s390x
            target: s390x-unknown-linux-gnu
            os: ubuntu-latest
            platform: linux/s390x
            architecture: "IBM S/390"

          - id: linux-s390x-musl
            target: s390x-unknown-linux-musl
            os: ubuntu-latest
            platform: linux/s390x
            architecture: "IBM S/390"

          #
          # MacOS
          #

          - id: macos-arm64
            target: aarch64-apple-darwin
            os: macos-15
            architecture: "arm64"

          - id: macos-x64
            target: x86_64-apple-darwin
            os: macos-15-intel
            architecture: "x86_64"

          #
          # Windows
          #

          - id: windows-x64
            target: x86_64-pc-windows-msvc
            os: windows-latest
            architecture: "x86-64"
            msvc_arch: "x64"
            pe_machine: "0x8664"
            python_architecture: "x64"
            vcpkg_triplet: "x64-windows"

          - id: windows-arm64
            target: aarch64-pc-windows-msvc
            os: windows-11-arm
            architecture: "AArch64"
            msvc_arch: "arm64"
            pe_machine: "0xaa64"
            python_architecture: "arm64"
            vcpkg_triplet: "arm64-windows"

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup environment
        run: |
          version=$(echo "${{ github.ref_name }}" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$') || true

          if [ -z "$version" ]; then
            # Set default version for non-release builds
            version="18.6.0"
          fi

          root_directory="$(pwd)"
          postgresql_version=$(echo "$version" | awk -F. '{print ""$1"."$2}')
          postgresql_major_version=$(echo "$version" | awk -F. '{print ""$1}')
          archive="postgresql-$version-${{ matrix.target }}"
          install_directory="$root_directory/$archive"

          echo "ARCHIVE=$archive" | tee -a $GITHUB_ENV
          echo "BUILD_SUPPORTED=true" | tee -a $GITHUB_ENV
          echo "INSTALL_DIRECTORY=$install_directory" | tee -a $GITHUB_ENV
          echo "PLATFORM=${{ matrix.platform }}" | tee -a $GITHUB_ENV
          echo "POSTGRESQL_MAJOR_VERSION=$postgresql_major_version" | tee -a $GITHUB_ENV
          echo "POSTGRESQL_VERSION=$postgresql_version" | tee -a $GITHUB_ENV
          echo "ROOT_DIRECTORY=$root_directory" | tee -a $GITHUB_ENV
          echo "VERSION=$version" | tee -a $GITHUB_ENV

      - name: Check build support
        id: build_support
        run: |
          supported=true

          if [[ "${{ matrix.id }}" == "windows-arm64" && "$POSTGRESQL_MAJOR_VERSION" -lt 16 ]]; then
            echo "::notice::Windows ARM64 source builds require PostgreSQL 16 or newer; skipping PostgreSQL $POSTGRESQL_VERSION."
            supported=false
          fi

          echo "supported=$supported" | tee -a "$GITHUB_OUTPUT"
          echo "BUILD_SUPPORTED=$supported" | tee -a "$GITHUB_ENV"

      #
      # Linux Build
      #

      - name: Build (Linux)
        if: ${{ startsWith(matrix.id, 'linux-') }}
        run: ./scripts/build-linux.sh "$VERSION" "${{ matrix.target }}" "${{ matrix.platform }}"

      #
      # MacOS Build
      #

      - name: Build (MacOS)
        if: ${{ startsWith(matrix.id, 'macos-') }}
        run: ./scripts/build-macos.sh "$VERSION" "${{ matrix.target }}"

      #
      # Windows
      #

      - name: Setup Python (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') && steps.build_support.outputs.supported == 'true' }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          architecture: ${{ matrix.python_architecture }}

      - name: Configure MSVC (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') && steps.build_support.outputs.supported == 'true' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build (Windows)
        if: ${{ startsWith(matrix.id, 'windows-') && steps.build_support.outputs.supported == 'true' }}
        run: ./scripts/build-windows.sh "$VERSION" "${{ matrix.target }}" "${{ matrix.vcpkg_triplet }}"

      #
      # Package
      #

      - name: Prepare archive
        if: ${{ steps.build_support.outputs.supported == 'true' }}
        run: |
          cp $ROOT_DIRECTORY/{README.md,LICENSE} "$INSTALL_DIRECTORY"
          ls -l "$INSTALL_DIRECTORY/"

      # The .tar.gz archive is the primary archive for all platforms.  This archive
      # provides a consistent experience for programmatic cases (e.g. embedded).
      - name: Build archive (Linux, MacOS)
        if: ${{ steps.build_support.outputs.supported == 'true' && !startsWith(matrix.id, 'windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          shasum -a 256 "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      - name: Build archive (Windows)
        if: ${{ steps.build_support.outputs.supported == 'true' && startsWith(matrix.id, 'windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          certutil -hashfile "$ARCHIVE.tar.gz" SHA256 > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      # The zip archive for Windows is created as a convenience to users for manual installations.
      - name: Build .zip archive (Windows)
        if: ${{ steps.build_support.outputs.supported == 'true' && startsWith(matrix.id, 'windows-') }}
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          certutil -hashfile "$ARCHIVE.zip" SHA256 > "$ARCHIVE.zip.sha256"
          echo "WINDOWS_ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          echo "WINDOWS_ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV

      #
      # Test
      #

      - name: Test the binary file cpu architecture
        if: ${{ steps.build_support.outputs.supported == 'true' }}
        run: |
          postgres_file="$INSTALL_DIRECTORY/bin/postgres"
          
          if [[ "${{ matrix.id }}" == windows-* ]]; then
            postgres_file="$INSTALL_DIRECTORY/bin/postgres.exe"
            cpu_architecture=$(python - "$postgres_file" <<'PY'
          import pathlib
          import struct
          import sys

          path = pathlib.Path(sys.argv[1])
          data = path.read_bytes()

          if data[:2] != b'MZ':
              raise SystemExit(f"{path} is not a PE executable")

          pe_offset = struct.unpack_from('<I', data, 0x3c)[0]
          if data[pe_offset:pe_offset + 4] != b'PE\0\0':
              raise SystemExit(f"{path} is missing a PE header")

          machine = struct.unpack_from('<H', data, pe_offset + 4)[0]
          sys.stdout.write(f"0x{machine:04x}")
          PY
            )
          elif [[ "${{ matrix.id }}" == linux-* ]]; then
            cpu_architecture=$(readelf --file-header "$postgres_file" | grep 'Machine:')
          else
            cpu_architecture=$(file "$postgres_file")
          fi
          
          echo "CPU_ARCHITECTURE=$cpu_architecture" | tee -a $GITHUB_ENV
          
          if [[ "${{ matrix.id }}" == windows-* ]]; then
            if [[ "$cpu_architecture" != "${{ matrix.pe_machine }}" ]]; then
              echo "ERROR: CPU architecture ($cpu_architecture) does not match expected architecture (${{ matrix.pe_machine }})"
              exit 1
            fi
          else
            if [[ "$cpu_architecture" != *"${{ matrix.architecture }}"* ]]; then
              echo "ERROR: CPU architecture ($cpu_architecture) does not match expected architecture (${{ matrix.architecture }})"
              exit 1
            fi
          fi

      - name: Test build / archive
        if: ${{ steps.build_support.outputs.supported == 'true' }}
        run: |
          test_directory=$(mktemp -d)
          tar xzf "$ARCHIVE.tar.gz" -C "$test_directory"
          cd "$test_directory/$ARCHIVE"
          cp "$ROOT_DIRECTORY/scripts/test.sh" .
          
          if [[ "${{ matrix.id }}" = macos* ]]; then
            echo "Testing MacOS"
            ./test.sh $VERSION
          elif [[ "${{ matrix.id }}" = windows* ]]; then
            echo "Testing Windows"
            ./test.sh $VERSION
          elif [[ "${{ matrix.id }}" = *musl* ]]; then
            echo "Testing Linux MUSL"
            docker run \
              --platform "$PLATFORM" \
              --tty \
              --volume $(pwd):/opt/test \
              postgresql-build:latest \
              /bin/sh -c "cd /opt/test && ls -l && ./test.sh $VERSION"
          else
            echo "Testing Linux GNU"
            docker run \
              --platform "$PLATFORM" \
              --tty \
              --volume $(pwd):/opt/test \
              postgresql-build:latest \
              /bin/sh -c "cd /opt/test && ls -l && ./test.sh $VERSION"
          fi

      - name: Stage archive artifacts
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.upload_artifacts == true }}
        run: |
          mkdir -p artifacts
          cp "$ASSET" "$ASSET_SUM" artifacts/

          if [ -n "${WINDOWS_ASSET:-}" ]; then
            cp "$WINDOWS_ASSET" "$WINDOWS_ASSET_SUM" artifacts/
          fi

      - name: Upload archive artifacts
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v7
        with:
          name: postgresql-${{ matrix.id }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      #
      # Release
      #

      - name: Upload release archive
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" ${{ env.ASSET }} ${{ env.ASSET_SUM }}

      - name: Upload release archive (Windows)
        if: ${{ steps.build_support.outputs.supported == 'true' && inputs.release == true && startsWith(matrix.id, 'windows-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$VERSION" ${{ env.WINDOWS_ASSET }} ${{ env.WINDOWS_ASSET_SUM }}
