name: Build

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ${{ github.ref }}
      version:
        description: PostgreSQL packaging version to build
        type: string
        required: true
      target:
        description: Optional target triple; empty builds every supported target
        type: string
        default: ''
      release:
        description: if this is a release build
        type: boolean
        default: false
      upload_artifacts:
        description: if built archives should be uploaded as workflow artifacts
        type: boolean
        default: false

jobs:
  matrix:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}
      - id: select
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ inputs.target }}
        run: |
          arguments=(--version "$VERSION")
          if [ -n "$TARGET" ]; then arguments+=(--target "$TARGET"); fi
          echo "targets=$(python3 scripts/build-matrix.py "${arguments[@]}")" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.id }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.ref }}

      - name: Setup environment
        env:
          VERSION: ${{ inputs.version }}
        run: |
          sh scripts/postgresql-versions.sh validate "$VERSION"
          root_directory="$(pwd)"
          archive="postgresql-$VERSION-${{ matrix.target }}"
          install_directory="$root_directory/$archive"

          echo "ARCHIVE=$archive" | tee -a $GITHUB_ENV
          # The artifact-link workflow runs from main, including before this PR
          # merges. Keep its existing name filter compatible with versioned names.
          echo "ARTIFACT_NAME=postgresql-${VERSION//./_}-${{ matrix.id }}" >> "$GITHUB_ENV"
          echo "INSTALL_DIRECTORY=$install_directory" | tee -a $GITHUB_ENV
          echo "PLATFORM=${{ matrix.platform }}" | tee -a $GITHUB_ENV
          echo "ROOT_DIRECTORY=$root_directory" | tee -a $GITHUB_ENV
          echo "VERSION=$VERSION" | tee -a $GITHUB_ENV

      #
      # Linux Build
      #

      - name: Set up baseline CPU emulation
        if: ${{ matrix.baseline_build == true }}
        run: docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all # 2026-09-27

      - name: Check baseline CPU enforcement
        if: ${{ matrix.baseline_build == true }}
        timeout-minutes: 2
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: ./scripts/test-baseline-cpu.sh

      - name: Install source build prerequisites
        if: ${{ matrix.baseline_build == true }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bzip2 cpio file git jq patchelf patch perl python3 rsync unzip wget

      - name: Build (Linux)
        env:
          TARGET_CFLAGS: ${{ matrix.cflags }}
        if: ${{ contains(matrix.target, '-linux-') }}
        run: ./scripts/build-linux.sh "$VERSION" "${{ matrix.target }}" "${{ matrix.platform }}"

      #
      # MacOS Build
      #

      - name: Test macOS build helpers
        if: ${{ contains(matrix.target, '-apple-') }}
        run: |
          bash tests/test-macos-options.sh
          bash tests/test-macos-symlinks.sh

      - name: Build (MacOS)
        if: ${{ contains(matrix.target, '-apple-') }}
        run: ./scripts/build-macos.sh "$VERSION" "${{ matrix.target }}"

      #
      # Windows
      #

      - name: Setup Python (Windows)
        if: ${{ contains(matrix.target, '-windows-') }}
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
          architecture: ${{ matrix.python_architecture }}

      - name: Configure MSVC (Windows)
        if: ${{ contains(matrix.target, '-windows-') }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.msvc_arch }}

      - name: Build (Windows)
        if: ${{ contains(matrix.target, '-windows-') }}
        run: ./scripts/build-windows.sh "$VERSION" "${{ matrix.target }}" "${{ matrix.vcpkg_triplet }}"

      #
      # Package
      #

      - name: Check redistribution notices
        if: ${{ inputs.release == true && !contains(matrix.target, '-windows-') }}
        run: |
          jq -e '(.missing_notices // []) | length == 0' "$INSTALL_DIRECTORY/runtime-dependencies.json"

      - name: Validate binary target compatibility
        env:
          TARGET: ${{ matrix.target }}
        run: |
          if [[ "$TARGET" == *windows* ]]; then python_command=python; else python_command=python3; fi
          "$python_command" scripts/verify-target.py "$INSTALL_DIRECTORY" "$TARGET"

      - name: Prepare archive
        run: |
          cp $ROOT_DIRECTORY/{README.md,LICENSE} "$INSTALL_DIRECTORY"
          ls -l "$INSTALL_DIRECTORY/"

      # The .tar.gz archive is the primary archive for all platforms.  This archive
      # provides a consistent experience for programmatic cases (e.g. embedded).
      - name: Build archive (Linux, MacOS)
        if: ${{ !contains(matrix.target, '-windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          ./scripts/checksum.sh "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      - name: Build archive (Windows)
        if: ${{ contains(matrix.target, '-windows-') }}
        run: |
          tar czf "$ARCHIVE.tar.gz" "$ARCHIVE"
          ./scripts/checksum.sh "$ARCHIVE.tar.gz" > "$ARCHIVE.tar.gz.sha256"
          echo "ASSET=$ARCHIVE.tar.gz" | tee -a $GITHUB_ENV
          echo "ASSET_SUM=$ARCHIVE.tar.gz.sha256" | tee -a $GITHUB_ENV

      # The zip archive for Windows is created as a convenience to users for manual installations.
      - name: Build .zip archive (Windows)
        if: ${{ contains(matrix.target, '-windows-') }}
        run: |
          7z a "$ARCHIVE.zip" "$ARCHIVE"
          ./scripts/checksum.sh "$ARCHIVE.zip" > "$ARCHIVE.zip.sha256"
          echo "WINDOWS_ASSET=$ARCHIVE.zip" >> $GITHUB_ENV
          echo "WINDOWS_ASSET_SUM=$ARCHIVE.zip.sha256" >> $GITHUB_ENV

      #
      # Test
      #

      - name: Test build / archive
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          if [ -n "${RUNTIME_IMAGE:-}" ]; then
            : # Source-built targets provide their matching minimal runtime.
          elif [[ "$TARGET" == *musl* ]]; then
            export RUNTIME_IMAGE=alpine:3.19.0@sha256:51b67269f354137895d43f3b3d810bfacd3945438e94dc5ac55fdac340352f48
          elif [[ "$TARGET" == *linux* ]]; then
            export RUNTIME_IMAGE=debian:12.4@sha256:79becb70a6247d277b59c09ca340bbe0349af6aacb5afa90ec349528b53ce2c9
          fi
          ./scripts/test-archive.sh "$ASSET" "$VERSION"
          cp "$ASSET_SUM" "$ASSET.tested.sha256"
          if [ -n "${WINDOWS_ASSET:-}" ]; then
            ./scripts/test-archive.sh "$WINDOWS_ASSET" "$VERSION"
            cp "$WINDOWS_ASSET_SUM" "$WINDOWS_ASSET.tested.sha256"
          fi

      - name: Test with a different system ICU
        if: ${{ matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-unknown-linux-gnu' }}
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
          RUNTIME_IMAGE: postgresql-test-icu:local
        run: |
          docker build --platform "$PLATFORM" -f dockerfiles/Dockerfile.test-icu -t "$RUNTIME_IMAGE" .
          ./scripts/test-archive.sh "$ASSET" "$VERSION"

      - name: Stage archive artifacts
        if: ${{ inputs.upload_artifacts == true }}
        run: |
          mkdir -p artifacts
          cp "$ASSET" "$ASSET_SUM" artifacts/

          if [ -n "${WINDOWS_ASSET:-}" ]; then
            cp "$WINDOWS_ASSET" "$WINDOWS_ASSET_SUM" artifacts/
          fi

      - name: Upload archive artifacts
        id: archive_artifacts
        if: ${{ inputs.upload_artifacts == true }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: artifacts/*
          if-no-files-found: error
          retention-days: 14

      - name: Link archive artifacts
        if: ${{ steps.archive_artifacts.outputs.artifact-url != '' }}
        env:
          ARTIFACT_URL: ${{ steps.archive_artifacts.outputs.artifact-url }}
        run: |
          echo "### PostgreSQL $VERSION archives (${{ matrix.target }})" >> "$GITHUB_STEP_SUMMARY"
          echo "[Download archives and SHA-256 checksums]($ARTIFACT_URL) (retained for 14 days)." >> "$GITHUB_STEP_SUMMARY"

      #
      # Release
      #

      - name: Upload release archive
        if: ${{ inputs.release == true }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-checksum.sh "$ASSET" "$ASSET.tested.sha256"
          gh release upload "$VERSION" "$ASSET" "$ASSET_SUM"
          mkdir draft-check
          gh release download "$VERSION" --pattern "$ASSET" --dir draft-check
          ./scripts/verify-checksum.sh "draft-check/$ASSET" "$ASSET.tested.sha256"

      - name: Upload release archive (Windows)
        if: ${{ inputs.release == true && contains(matrix.target, '-windows-') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./scripts/verify-checksum.sh "$WINDOWS_ASSET" "$WINDOWS_ASSET.tested.sha256"
          gh release upload "$VERSION" "$WINDOWS_ASSET" "$WINDOWS_ASSET_SUM"
          gh release download "$VERSION" --pattern "$WINDOWS_ASSET" --dir draft-check
          ./scripts/verify-checksum.sh "draft-check/$WINDOWS_ASSET" "$WINDOWS_ASSET.tested.sha256"
