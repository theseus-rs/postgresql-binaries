name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: sudo apt-get update && sudo apt-get install -y patchelf jq llvm
      - name: Test build helpers and archive portability
        run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          for test in tests/test*.sh; do bash "$test"; done
          python3 -m unittest discover -s tests -p 'test_*.py'

  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Select supported PostgreSQL versions
        id: versions
        run: echo "plan=$(python3 scripts/build-matrix.py)" >> "$GITHUB_OUTPUT"
      - name: Get PR head ref
        if: ${{ github.event_name == 'pull_request' }}
        id: pr_head_ref
        run: |
          echo "ref=refs/pull/${{ github.event.pull_request.number }}/head" >> $GITHUB_OUTPUT
    outputs:
      versions: ${{ steps.versions.outputs.plan }}
      ref: >-
        ${{
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v'))
          && steps.pr_head_ref.outputs.ref
          || github.ref
        }}

  build:
    name: Build
    needs: [initialize, regression]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.initialize.outputs.ref }}
      version: ${{ fromJSON(needs.initialize.outputs.versions).latest }}
      upload_artifacts: ${{ github.event_name == 'pull_request' }}

  supported_versions:
    name: PostgreSQL ${{ matrix.version }}
    needs: [initialize, regression]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.initialize.outputs.versions).previous }}
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.initialize.outputs.ref }}
      version: ${{ matrix.version }}
      upload_artifacts: ${{ github.event_name == 'pull_request' }}

  compatibility:
    name: Oldest PostgreSQL ${{ matrix.version }} (${{ matrix.target }})
    needs: [initialize, regression]
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJSON(needs.initialize.outputs.versions).oldest }}
        target: [x86_64-unknown-linux-musl, aarch64-apple-darwin, x86_64-apple-darwin]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.initialize.outputs.ref }}
      version: ${{ matrix.version }}
      target: ${{ matrix.target }}
      upload_artifacts: ${{ github.event_name == 'pull_request' }}

  supported_versions_result:
    name: All supported PostgreSQL versions
    if: ${{ always() }}
    needs: [initialize, regression, build, supported_versions, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every version and compatibility build to pass
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
        run: jq -e 'all(. == "success")' <<< "$RESULTS"
