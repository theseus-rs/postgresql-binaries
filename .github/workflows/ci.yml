name: ci

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  regression:
    name: Regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt-get update && sudo apt-get install -y patchelf jq llvm
      - run: |
          for script in scripts/*.sh tests/*.sh; do bash -n "$script"; done
          for test in tests/test*.sh; do bash "$test"; done

  initialize:
    name: Initialize
    runs-on: ubuntu-latest
    steps:
      - name: Get PR head ref
        if: ${{ github.event_name == 'pull_request' }}
        id: pr_head_ref
        run: |
          echo "ref=refs/pull/${{ github.event.pull_request.number }}/head" >> $GITHUB_OUTPUT
    outputs:
      ref: >-
        ${{
          (github.event_name == 'pull_request' && startsWith(github.head_ref, 'release/v'))
          && steps.pr_head_ref.outputs.ref
          || github.ref
        }}

  build:
    name: Build
    needs: [initialize]
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.initialize.outputs.ref }}
      upload_artifacts: ${{ github.event_name == 'pull_request' }}
