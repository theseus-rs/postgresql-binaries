name: Verify public release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published packaging version to verify
        required: true
        default: 18.6.0

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: linux-arm64
            target: "aarch64-unknown-linux-gnu"
            os: "ubuntu-latest"
            platform: "linux/arm64/v8"
            architecture: "AArch64"
            cflags: "-O2 -march=armv8-a"
            qemu_cpu: "cortex-a53"

          - id: linux-arm64-musl
            target: "aarch64-unknown-linux-musl"
            os: "ubuntu-latest"
            platform: "linux/arm64/v8"
            architecture: "AArch64"
            cflags: "-O2 -march=armv8-a"
            qemu_cpu: "cortex-a53"

          - id: linux-arm
            target: "arm-unknown-linux-gnueabi"
            os: "ubuntu-latest"
            platform: "linux/arm/v5"
            architecture: "ARM"
            cflags: "-O2 -march=armv6 -mfloat-abi=soft"
            qemu_cpu: "arm1176"

          - id: linux-armhf-musl
            target: "arm-unknown-linux-musleabihf"
            os: "ubuntu-latest"
            platform: "linux/arm/v6"
            architecture: "ARM"
            cflags: "-O2 -march=armv6 -mfloat-abi=hard -mfpu=vfp"
            qemu_cpu: "arm1176"

          - id: linux-armv5te
            target: "armv5te-unknown-linux-gnueabi"
            os: "ubuntu-latest"
            platform: "linux/arm/v5"
            architecture: "ARM"
            cflags: "-O2 -march=armv5te -mfloat-abi=soft"
            qemu_cpu: "arm926"

          - id: linux-armv7l
            target: "armv7-unknown-linux-gnueabihf"
            os: "ubuntu-latest"
            platform: "linux/arm/v7"
            architecture: "ARM"
            cflags: "-O2 -march=armv7-a -mfloat-abi=hard -mfpu=vfp"
            qemu_cpu: "cortex-a7"

          - id: linux-armv7l-musl
            target: "armv7-unknown-linux-musleabihf"
            os: "ubuntu-latest"
            platform: "linux/arm/v7"
            architecture: "ARM"
            cflags: "-O2 -march=armv7-a -mfloat-abi=hard -mfpu=vfp"
            qemu_cpu: "cortex-a7"

          - id: linux-x64
            target: "x86_64-unknown-linux-gnu"
            os: "ubuntu-24.04-arm"
            platform: "linux/amd64"
            architecture: "Advanced Micro Devices X86-64"
            cflags: "-O2 -march=x86-64"
            qemu_cpu: "qemu64,-sse3,-cx16,-lahf-lm"

          - id: linux-x64-musl
            target: "x86_64-unknown-linux-musl"
            os: "ubuntu-24.04-arm"
            platform: "linux/amd64"
            architecture: "Advanced Micro Devices X86-64"
            cflags: "-O2 -march=x86-64"
            qemu_cpu: "qemu64,-sse3,-cx16,-lahf-lm"

          - id: linux-x86
            target: "i686-unknown-linux-gnu"
            os: "ubuntu-24.04-arm"
            platform: "linux/386"
            architecture: "Intel 80386"
            cflags: "-O2 -march=i686 -msse2 -mfpmath=sse"
            qemu_cpu: "qemu32,-sse3"

          - id: linux-x86-musl
            target: "i686-unknown-linux-musl"
            os: "ubuntu-24.04-arm"
            platform: "linux/386"
            architecture: "Intel 80386"
            cflags: "-O2 -march=i686 -msse2 -mfpmath=sse"
            qemu_cpu: "qemu32,-sse3"

          - id: linux-mips64le
            target: "mips64el-unknown-linux-gnuabi64"
            os: "ubuntu-latest"
            platform: "linux/mips64le"
            architecture: "MIPS R3000"
            cflags: "-O2 -march=mips64r2"
            qemu_cpu: "MIPS64R2-generic"

          - id: linux-powerpc64el
            target: "powerpc64le-unknown-linux-gnu"
            os: "ubuntu-latest"
            platform: "linux/ppc64le"
            architecture: "PowerPC64"
            cflags: "-O2 -mcpu=power8"
            qemu_cpu: "power8"

          - id: linux-powerpc64el-musl
            target: "powerpc64le-unknown-linux-musl"
            os: "ubuntu-latest"
            platform: "linux/ppc64le"
            architecture: "PowerPC64"
            cflags: "-O2 -mcpu=power8"
            qemu_cpu: "power8"

          - id: linux-s390x
            target: "s390x-unknown-linux-gnu"
            os: "ubuntu-latest"
            platform: "linux/s390x"
            architecture: "IBM S/390"
            cflags: "-O2 -march=z196"
            qemu_cpu: "z196"

          - id: linux-s390x-musl
            target: "s390x-unknown-linux-musl"
            os: "ubuntu-latest"
            platform: "linux/s390x"
            architecture: "IBM S/390"
            cflags: "-O2 -march=z196"
            qemu_cpu: "z196"

          - id: macos-arm64
            target: "aarch64-apple-darwin"
            os: "macos-15"
            architecture: "arm64"

          - id: macos-x64
            target: "x86_64-apple-darwin"
            os: "macos-15-intel"
            architecture: "x86_64"

          - id: windows-x64
            target: "x86_64-pc-windows-msvc"
            os: "windows-latest"
            architecture: "x86-64"

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Download and execute public archive
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          if [[ "$TARGET" == *linux* ]]; then
            docker run --privileged --rm tonistiigi/binfmt@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0 --install all # 2026-09-27
            if [[ "$TARGET" == *musl* ]]; then
              export RUNTIME_IMAGE=alpine:3.19.0@sha256:51b67269f354137895d43f3b3d810bfacd3945438e94dc5ac55fdac340352f48
            else
              export RUNTIME_IMAGE=debian:12.4@sha256:79becb70a6247d277b59c09ca340bbe0349af6aacb5afa90ec349528b53ce2c9
            fi
          fi
          extensions=(tar.gz)
          if [[ "$TARGET" == *windows* ]]; then extensions+=(zip); fi
          for extension in "${extensions[@]}"; do
            asset="postgresql-$VERSION-$TARGET.$extension"
            for file in "$asset" "$asset.sha256"; do
              curl --fail --location --silent --show-error --retry 3 \
                --proto '=https' --proto-redir '=https' \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$file" -o "$file"
            done
            ./scripts/test-archive.sh "$asset" "$VERSION"
          done
