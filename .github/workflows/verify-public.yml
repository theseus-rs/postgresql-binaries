name: Verify public release

on:
  workflow_call:
    inputs:
      version:
        type: string
        required: true
  workflow_dispatch:
    inputs:
      version:
        description: Published packaging version to verify
        required: true

permissions:
  contents: read

jobs:
  matrix:
    name: Select targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.select.outputs.targets }}
    steps:
      - uses: actions/checkout@v6
      - id: select
        env:
          VERSION: ${{ inputs.version }}
        run: echo "targets=$(python3 scripts/build-matrix.py --version "$VERSION")" >> "$GITHUB_OUTPUT"

  verify:
    name: ${{ matrix.id }}
    needs: matrix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.targets) }}

    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up CPU emulation
        if: ${{ contains(matrix.target, '-linux-') }}
        run: bash scripts/setup-binfmt.sh

      - name: Check baseline CPU enforcement
        if: ${{ matrix.baseline_build == true }}
        timeout-minutes: 2
        env:
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: ./scripts/test-baseline-cpu.sh

      - name: Build baseline runtime
        if: ${{ matrix.baseline_build == true }}
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bzip2 cpio file git patch perl python3 rsync unzip wget
          ./scripts/build-baseline-linux.sh "$VERSION" "$TARGET" "$PLATFORM" runtime

      - name: Download and execute public archive
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
          PLATFORM: ${{ matrix.platform }}
          QEMU_CPU: ${{ matrix.qemu_cpu }}
        run: |
          if [[ "$TARGET" == *linux* ]]; then
            if [ -n "${RUNTIME_IMAGE:-}" ]; then
              : # Source-built targets provide their matching minimal runtime.
            elif [[ "$TARGET" == *musl* ]]; then
              export RUNTIME_IMAGE=alpine:3.19.0@sha256:51b67269f354137895d43f3b3d810bfacd3945438e94dc5ac55fdac340352f48
            else
              export RUNTIME_IMAGE=debian:12.4@sha256:79becb70a6247d277b59c09ca340bbe0349af6aacb5afa90ec349528b53ce2c9
            fi
          fi
          extensions=(tar.gz)
          if [[ "$TARGET" == *windows* ]]; then extensions+=(zip); fi
          for extension in "${extensions[@]}"; do
            asset="postgresql-$VERSION-$TARGET.$extension"
            for file in "$asset" "$asset.sha256" "$asset.manifest.json" "$asset.spdx.json"; do
              curl --fail --location --silent --show-error --retry 3 \
                --proto '=https' --proto-redir '=https' \
                "https://github.com/$GITHUB_REPOSITORY/releases/download/$VERSION/$file" -o "$file"
            done
            if [[ "$TARGET" == *windows* ]]; then python_command=python; else python_command=python3; fi
            "$python_command" scripts/archive-manifest.py verify "$asset"
            gh attestation verify "$asset" --repo "$GITHUB_REPOSITORY"
            ./scripts/test-archive.sh "$asset" "$VERSION"
          done
