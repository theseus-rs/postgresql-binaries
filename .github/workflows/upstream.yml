name: Check upstream versions

on:
  schedule:
    - cron: '23 9 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Report upstream changes
        run: |
          set -o pipefail
          python3 scripts/check-upstream.py | tee -a "$GITHUB_STEP_SUMMARY"
