name: PR build artifacts

on:
  workflow_run:
    workflows: [ci]
    types: [completed]

# Run separately so fork PR builds keep their read-only token. This workflow
# only reads GitHub metadata; it never checks out or executes PR code/artifacts.
permissions:
  actions: read
  pull-requests: write

concurrency:
  group: pr-artifacts-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  comment:
    if: ${{ github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - name: Link build artifacts on the pull request
        uses: actions/github-script@v8
        with:
          script: |
            const run = context.payload.workflow_run;
            const repo = context.repo;
            let pullRequests = run.pull_requests;

            // Fork runs may omit the associated PRs from the event payload.
            if (!pullRequests.length) {
              pullRequests = await github.paginate(github.rest.pulls.list, {
                ...repo,
                state: 'open',
                head: `${run.head_repository.owner.login}:${run.head_branch}`,
                per_page: 100,
              });
            }

            const artifacts = (await github.paginate(
              github.rest.actions.listWorkflowRunArtifacts,
              { ...repo, run_id: run.id, per_page: 100 },
            )).filter(artifact => !artifact.expired && /^postgresql-[a-z0-9-]+$/.test(artifact.name))
              .sort((a, b) => a.name.localeCompare(b.name));

            const runUrl = `${context.serverUrl}/${repo.owner}/${repo.repo}/actions/runs/${run.id}`;
            const marker = `<!-- postgresql-build-artifacts:${run.id} -->`;
            const body = [
              marker,
              '### PostgreSQL CI build artifacts',
              '',
              `[CI run #${run.run_number}, attempt ${run.run_attempt}](${runUrl}) for commit \`${run.head_sha}\` finished with status **${run.conclusion}**.`,
              '',
              ...artifacts.map(artifact => `- [${artifact.name}](${runUrl}/artifacts/${artifact.id})`),
              '',
              artifacts.length
                ? 'Downloads contain tested archives and SHA-256 checksums. Only targets that completed their build and archive tests are listed. Artifacts are retained for 14 days; sign in to GitHub to download.'
                : 'No downloadable build artifacts were produced. See the CI run for details.',
            ].join('\n');

            for (const candidate of pullRequests) {
              const { data: pr } = await github.rest.pulls.get({
                ...repo, pull_number: candidate.number,
              });
              // Do not post an old build on a PR that has moved to another commit.
              if (pr.state !== 'open' || pr.head.sha !== run.head_sha ||
                  pr.head.repo?.id !== run.head_repository.id) continue;

              const comments = await github.paginate(github.rest.issues.listComments, {
                ...repo, issue_number: pr.number, per_page: 100,
              });
              const existing = comments.find(comment =>
                comment.user.login === 'github-actions[bot]' && comment.body?.startsWith(marker));

              if (existing) {
                await github.rest.issues.updateComment({
                  ...repo, comment_id: existing.id, body,
                });
              } else {
                await github.rest.issues.createComment({
                  ...repo, issue_number: pr.number, body,
                });
              }
            }
